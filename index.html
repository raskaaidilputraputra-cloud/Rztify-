let IDBp=null;
function idb(){return IDBp||(IDBp=new Promise((res,rej)=>{try{const r=indexedDB.open('rztify',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('local'))d.createObjectStore('local',{keyPath:'id'}).createIndex('uid','uid');if(!d.objectStoreNames.contains('dl'))d.createObjectStore('dl',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}}))}
const idbR=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function locAll(uid){const d=await idb();return idbR(d.transaction('local').objectStore('local').index('uid').getAll(uid))}
async function locTx(fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('local','readwrite');fn(t.objectStore('local'));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))})}
const locPut=rec=>locTx(x=>x.put(rec)),locDel=id=>locTx(x=>x.delete(id));
const recToTrack=r=>({id:r.id,title:r.title,artist:r.artist,album:'',art:ph(),url:URL.createObjectURL(r.blob),local:1,lrc:r.lrc||undefined,size:r.size||0,fname:r.name||r.title});
const revokeLocal=()=>{local.forEach(t=>{try{URL.revokeObjectURL(t.url)}catch(e){}})};
async function locLoad(){const uid=U&&U.uid;if(!uid)return;try{const rs=await locAll(uid);if(!U||U.uid!=uid)return;revokeLocal();local=rs.sort((x,y)=>y.added-x.added).map(recToTrack);if(S.view=='lib'&&!S.sub)rLib()}catch(e){}}
